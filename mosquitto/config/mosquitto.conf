# SARI Tactical Perimeter MQTT Broker Configuration
# Plain listener kept during the TLS transition (see conf.d/tls.conf.example).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
# Per-user topic permissions; everything not granted is denied.
acl_file /mosquitto/config/acl

# Storage & Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Max message size: 10 MB (Allows Base64 high-resolution JPEG snapshots)
message_size_limit 10485760

# Keepalive and queue limits
max_queued_messages 1000

# Optional listeners (TLS on 8883). Only files ending in .conf are loaded.
include_dir /mosquitto/config/conf.d
