# SARI Tactical Perimeter MQTT Broker Configuration
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# Storage & Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Max message size: 10 MB (Allows Base64 high-resolution JPEG snapshots)
message_size_limit 10485760

# Keepalive and queue limits
max_queued_messages 1000
