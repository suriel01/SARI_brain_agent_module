[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs the running docker compose stack (broker, Postgres, backend)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["NeMo-Guardrails", "sari-ui"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
