services:
  sari-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sari-backend
    ports:
      - "7000:7000"
      - "8000:7000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./backend/app:/app/app
      - ./tests:/app/tests
    environment:
      - PORT=7000
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:7b
      - SIRENA_SERVICE_URL=http://sari-sirena:5000
      - DATABASE_URL=postgresql://sari_user:sari_password@postgres_db:5432/sari_db
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=ollama
      - SARI_SECRET_KEY=SARI_SUPER_SECRET_KEY
      - SARI_SECURITY_PIN=1234
      - SARI_TOKEN_EXPIRE_MINUTES=720
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - MQTT_BROKER_HOST=sari-mqtt
      - MQTT_BROKER_PORT=1883
      - MQTT_USER=sari_operator
      - MQTT_PASSWORD=sari_secure_password_2026
      - TZ=America/Mexico_City
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_POLLING_ENABLED=${TELEGRAM_POLLING_ENABLED:-true}
    depends_on:
      postgres_db:
        condition: service_healthy
      sari-mqtt:
        condition: service_started
    restart: unless-stopped

  sari-mqtt:
    image: eclipse-mosquitto:2.0
    container_name: sari-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  sari-sirena:
    build:
      context: .
      dockerfile: Dockerfile.sirena
    container_name: sari-sirena
    ports:
      - "5000:5000"
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - /home/surielalcantara/.config/pulse/cookie:/root/.config/pulse/cookie
    devices:
      - "/dev/snd:/dev/snd"
    restart: unless-stopped

  sari-ui:
    build:
      context: ./sari-ui
      dockerfile: Dockerfile
    container_name: sari-ui
    ports:
      - "5173:80"
    restart: unless-stopped

  postgres_db:
    image: pgvector/pgvector:pg15
    container_name: sari_postgres
    environment:
      POSTGRES_USER: sari_user
      POSTGRES_PASSWORD: sari_password
      POSTGRES_DB: sari_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sari_user -d sari_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
    name: sari-network
